name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Check Python syntax
        run: python -m compileall -q bot scripts tests

      - name: Check browser JavaScript syntax
        run: node --check site/app.js

      - name: Check required site files
        run: test -s site/index.html && test -s site/app.js && test -s site/styles.css
